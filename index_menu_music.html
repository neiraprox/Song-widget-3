<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Song Widget — Álbumes</title>
<style>
:root{--rgb:30 215 96;--accent:#1ed760}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#020304;color:#fff}
body{overflow-x:hidden}
button,input{font:inherit}
#bg{position:fixed;inset:-80px;background:radial-gradient(circle at 15% 25%,rgb(var(--rgb)/.24),transparent 30%),radial-gradient(circle at 85% 70%,rgb(var(--rgb)/.18),transparent 32%),#020304;filter:blur(20px);transform:scale(1.12);transition:all .7s ease}
#shade{position:fixed;inset:0;background:linear-gradient(135deg,#020304c8,#020304ed)}
.light{position:fixed;width:40vw;height:40vw;border-radius:50%;filter:blur(90px);opacity:.28;mix-blend-mode:screen;pointer-events:none;animation:float 12s ease-in-out infinite alternate}
.l1{left:-13vw;top:-16vw;background:rgb(var(--rgb))}.l2{right:-14vw;bottom:-20vw;background:rgb(var(--rgb));animation-delay:-5s}
@keyframes float{to{transform:translate(4vw,3vh) scale(1.12)}}
main{position:relative;z-index:2;width:min(1220px,94vw);margin:auto;padding:28px 0 50px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.logo{font-size:14px;font-weight:900;letter-spacing:3px}.logo span{color:rgb(var(--rgb))}
.status{font-size:12px;color:#85878f;letter-spacing:1px}
.intro{position:relative;overflow:hidden;border:1px solid #ffffff10;border-radius:30px;padding:40px;background:linear-gradient(135deg,#101216ef,#08090ced);box-shadow:0 30px 90px #000b;margin-bottom:18px}
.intro:before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 20% 10%,rgb(var(--rgb)/.28),transparent 30%),radial-gradient(circle at 85% 80%,rgb(var(--rgb)/.16),transparent 35%);filter:blur(28px)}
.intro>*{position:relative;z-index:2}
.kicker{font-size:11px;letter-spacing:4px;color:rgb(var(--rgb));font-weight:900}
h1{font-size:clamp(42px,6vw,76px);letter-spacing:-4px;line-height:.95;margin:10px 0 15px;font-weight:950}
.intro p{max-width:760px;color:#91939b;line-height:1.55;font-size:17px;margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}
.primary,.random{border:0;border-radius:999px;padding:13px 19px;font-weight:900;cursor:pointer;transition:.2s}
.primary{background:rgb(var(--rgb));color:#050505;box-shadow:0 0 30px rgb(var(--rgb)/.25)}
.random{background:#15171b;color:#fff;border:1px solid #ffffff14}
.primary:hover,.random:hover{transform:translateY(-2px)}
.section{font-size:12px;letter-spacing:3px;color:#7e8088;font-weight:900;margin:26px 0 13px}
.album-showcase{margin-top:18px}
.showcase-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}
.showcase-head h1{font-size:clamp(30px,4vw,56px);line-height:.95;margin:6px 0 8px;letter-spacing:-2px}
.showcase-head p{margin:0;color:#888b94;font-size:14px}
.album-carousel{position:relative}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;overflow:hidden}
.card{position:relative;overflow:hidden;border:1px solid #ffffff0c;border-radius:21px;background:#0b0d10e8;padding:12px;box-shadow:0 15px 45px #0006;transition:opacity .28s ease,transform .28s ease,filter .28s ease}
.arrow{position:absolute;z-index:5;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid #ffffff18;background:#090b0ef2;color:#fff;font-size:34px;line-height:1;cursor:pointer;box-shadow:0 10px 30px #0009;backdrop-filter:blur(10px);transition:.2s}
.arrow:hover{transform:translateY(-50%) scale(1.08);background:#15181df2}
.arrow.left{left:-24px}.arrow.right{right:-24px}
.dots{display:flex;justify-content:center;gap:7px;margin-top:17px}
.dot{width:7px;height:7px;border-radius:50%;background:#3b3e44;transition:.25s;cursor:pointer}
.dot.active{width:22px;border-radius:8px;background:rgb(var(--rgb))}
.card:hover{transform:translateY(-5px);border-color:rgb(var(--rgb)/.28);box-shadow:0 20px 50px #0008}
.cover{position:relative;width:100%;aspect-ratio:1;border-radius:15px;overflow:hidden;background:linear-gradient(135deg,#1a1c20,#0d0e11)}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:.35s}.card:hover .cover img{transform:scale(1.035)}
.info{padding:13px 3px 4px}
.title{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:13px;color:#8b8d95;margin-top:4px}
.year{font-size:11px;color:#5f6168;margin-top:3px}
.fact{font-size:12px;line-height:1.4;color:#777981;margin-top:10px;min-height:50px}
.listen{width:100%;border:0;border-radius:12px;padding:10px;background:rgb(var(--rgb)/.12);color:rgb(var(--rgb));font-weight:900;cursor:pointer;margin-top:8px;transition:.2s}
.listen:hover{background:rgb(var(--rgb)/.23);transform:translateY(-1px)}
.search{margin-top:25px;border:1px solid #ffffff0d;border-radius:23px;background:#0b0d10e8;padding:22px}
.searchbar{display:flex;gap:10px;background:#05060899;border:1px solid #ffffff12;border-radius:15px;padding:8px}
.searchbar input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;padding:8px;font-size:16px}
.searchbar button{border:0;border-radius:11px;background:rgb(var(--rgb));color:#050505;font-weight:900;padding:0 18px;cursor:pointer}
.results{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.result{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:#121419;border:1px solid #ffffff09;cursor:pointer}
.result:hover{border-color:rgb(var(--rgb)/.25)}
.result img{width:60px;height:60px;border-radius:9px;object-fit:cover}
.result b{display:block}.result span{display:block;color:#74767c;font-size:12px;margin-top:3px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){main{width:94vw;padding-top:17px}.grid{grid-template-columns:repeat(2,1fr)}.intro{padding:28px 22px}h1{font-size:48px;letter-spacing:-3px}.results{grid-template-columns:1fr}.status{display:none}}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div><div class="light l1"></div><div class="light l2"></div>
<main>
  <div class="top"><div class="logo"><span>●</span> SONG WIDGET</div><div class="status">ALBUM COLLECTION</div></div>

  <section class="album-showcase">
    <div class="showcase-head">
      <div>
        <div class="kicker">ALBUMS • STORIES • MUSIC</div>
        <h1>Elige tu próximo disco.</h1>
        <p>Desliza por la colección. Cada cambio muestra <b>3 álbumes nuevos</b>.</p>
      </div>
      <div class="actions">
        <button class="primary" id="openPlayer">🎧 Reproductor</button>
        <button class="random" id="random">🔀 Aleatorio</button>
      </div>
    </div>

    <div class="album-carousel">
      <button class="arrow left" id="prevAlbums" aria-label="Álbumes anteriores">‹</button>
      <section class="grid" id="grid"></section>
      <button class="arrow right" id="nextAlbums" aria-label="Siguientes álbumes">›</button>
    </div>

    <div class="dots" id="dots"></div>
  </section>

  <section class="search">
    <div class="section" style="margin-top:0">BUSCAR MÁS ÁLBUMES</div>
    <div class="searchbar"><input id="q" placeholder="Busca un álbum o artista…"><button id="searchBtn">Buscar</button></div>
    <div class="results" id="results"></div>
  </section>
</main>

<script>
const CLIENT_ID="7cd5bc8f5dc048a388537fb6d19a74b9";
const REDIRECT_URI="https://neiraprox.github.io/spotify-song-widget/";
const PLAYER_URL="https://neiraprox.github.io/spotify-song-widget/";
const albums=[{"title": "The Romantic", "artist": "Bruno Mars", "year": "2026", "meta": "10 canciones", "track": "RISK IT ALL", "fact": "Álbum de 2026; mezcla el nuevo material de Bruno con su sonido pop y funk.", "query": "The Romantic", "artistQuery": "Bruno Mars"}, {"title": "Dangerous", "artist": "Michael Jackson", "year": "1991", "meta": "14 canciones", "track": "Black or White", "fact": "Uno de los grandes álbumes de Michael; incluye Black or White, Remember the Time y Dangerous.", "query": "Dangerous", "artistQuery": "Michael Jackson"}, {"title": "HIStory – PAST, PRESENT AND FUTURE – BOOK I", "artist": "Michael Jackson", "year": "1995", "meta": "30 canciones", "track": "Billie Jean", "fact": "Combina un disco de grandes éxitos con material nuevo en una de las etapas más importantes de Michael.", "query": "HIStory - PAST, PRESENT AND FUTURE - BOOK I", "artistQuery": "Michael Jackson"}, {"title": "Lover", "artist": "Taylor Swift", "year": "2019", "meta": "18 canciones", "track": "Cruel Summer", "fact": "Álbum pop de Taylor con 18 canciones; incluye Lover, Cruel Summer y Daylight.", "query": "Lover", "artistQuery": "Taylor Swift"}, {"title": "Thriller", "artist": "Michael Jackson", "year": "1982", "meta": "9 canciones", "track": "Billie Jean", "fact": "Uno de los álbumes más reconocidos de la historia; incluye Thriller, Beat It y Billie Jean.", "query": "Thriller", "artistQuery": "Michael Jackson"}, {"title": "NAGA", "artist": "Haruomi Hosono", "year": "1995", "meta": "11 canciones", "track": "Naga", "fact": "Trabajo de Hosono con una inspiración sonora ligada a Asia; incluye Hindustan, Naga y Serpent Cloud.", "query": "NAGA", "artistQuery": "Haruomi Hosono"}, {"title": "Satirología, Vol. 3", "artist": "Kidd Voodoo", "year": "2025", "meta": "13 canciones", "track": "La Verdad", "fact": "Parte de la etapa más experimental de Kidd Voodoo, con colaboraciones como Los Bunkers y Álvaro Díaz.", "query": "Satirología, Vol. 3", "artistQuery": "Kidd Voodoo"}, {"title": "Los Rompecorazones, Vol. 2", "artist": "Kidd Voodoo", "year": "2024", "meta": "12 canciones", "track": "Minnie <3", "fact": "Proyecto colaborativo de Kidd Voodoo con artistas de la escena urbana; incluye Minnie <3 y Prendía.", "query": "Los Rompecorazones, Vol. 2", "artistQuery": "Kidd Voodoo"}, {"title": "Euforia", "artist": "Kidd Voodoo", "year": "2026", "meta": "8 canciones", "track": "Incondicional", "fact": "Álbum chileno con colaboraciones de Mon Laferte, Pablo Alborán y Rels B.", "query": "Euforia", "artistQuery": "Kidd Voodoo"}, {"title": "Off the Wall", "artist": "Michael Jackson", "year": "1979", "meta": "10 canciones", "track": "Don't Stop 'Til You Get Enough", "fact": "El primer gran álbum adulto de Michael; incluye Rock with You y Don't Stop 'Til You Get Enough.", "query": "Off the Wall", "artistQuery": "Michael Jackson"}, {"title": "24K Magic", "artist": "Bruno Mars", "year": "2016", "meta": "9 canciones", "track": "24K Magic", "fact": "Álbum de funk, R&B y pop con éxitos como 24K Magic, That's What I Like y Finesse.", "query": "24K Magic", "artistQuery": "Bruno Mars"}, {"title": "ABC", "artist": "The Jackson 5", "year": "1970", "meta": "12 canciones", "track": "ABC", "fact": "Clásico de The Jackson 5; la canción ABC se convirtió en uno de sus mayores éxitos.", "query": "ABC", "artistQuery": "The Jackson 5"}, {"title": "Red", "artist": "Taylor Swift", "year": "2012", "meta": "16 canciones", "track": "Red", "fact": "Una etapa de transición de Taylor hacia el pop; incluye Red, 22, All Too Well y Begin Again.", "query": "Red", "artistQuery": "Taylor Swift"}, {"title": "Short n' Sweet", "artist": "Sabrina Carpenter", "year": "2024", "meta": "12 canciones", "track": "Espresso", "fact": "Álbum de 2024 que incluye Espresso, Please Please Please y Taste.", "query": "Short n' Sweet", "artistQuery": "Sabrina Carpenter"}, {"title": "Man's Best Friend", "artist": "Sabrina Carpenter", "year": "2025", "meta": "12 canciones", "track": "Manchild", "fact": "Álbum de 2025; continúa la etapa pop de Sabrina después de Short n' Sweet.", "query": "Man's Best Friend", "artistQuery": "Sabrina Carpenter"}, {"title": "LUX", "artist": "ROSALÍA", "year": "2025", "meta": "15 canciones", "track": "Berghain", "fact": "Álbum de ROSALÍA de 2025 con colaboraciones como Björk y Yves Tumor.", "query": "LUX", "artistQuery": "ROSALÍA"}, {"title": "SWAG", "artist": "Justin Bieber", "year": "2025", "meta": "21 canciones", "track": "DAISIES", "fact": "Álbum de 2025 con 21 canciones, incluyendo DAISIES, YUKON y GO BABY.", "query": "SWAG", "artistQuery": "Justin Bieber"}, {"title": "Harry's House", "artist": "Harry Styles", "year": "2022", "meta": "13 canciones", "track": "As It Was", "fact": "Álbum de 2022 con canciones como As It Was, Late Night Talking y Matilda.", "query": "Harry's House", "artistQuery": "Harry Styles"}];
let token=localStorage.getItem("spotify_token");

function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
async function pkce(){const verifier=b64(crypto.getRandomValues(new Uint8Array(32)));const hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier));localStorage.setItem("menu_verifier",verifier);return b64(hash)}
async function login(){const challenge=await pkce();const u=new URL("https://accounts.spotify.com/authorize");u.searchParams.set("client_id",CLIENT_ID);u.searchParams.set("response_type","code");u.searchParams.set("redirect_uri",REDIRECT_URI);u.searchParams.set("scope","user-read-playback-state user-read-currently-playing user-modify-playback-state");u.searchParams.set("code_challenge_method","S256");u.searchParams.set("code_challenge",challenge);location.href=u.toString()}
async function exchange(){const code=new URLSearchParams(location.search).get("code");if(!code)return false;const verifier=localStorage.getItem("menu_verifier");if(!verifier)return false;const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:"authorization_code",code,redirect_uri:REDIRECT_URI,code_verifier:verifier})});if(!r.ok)throw Error("Spotify login failed");const d=await r.json();token=d.access_token;localStorage.setItem("spotify_token",token);history.replaceState({},document.title,REDIRECT_URI);return true}
async function api(path,opt={}){const r=await fetch("https://api.spotify.com/v1"+path,{...opt,headers:{Authorization:"Bearer "+token,...(opt.headers||{})}});if(r.status===401){localStorage.removeItem("spotify_token");token=null;throw Error("expired")}if(r.status===204)return null;if(!r.ok)throw Error("Spotify "+r.status);return r.json()}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function getArtwork(album,artist){try{const r=await fetch("https://itunes.apple.com/search?term="+encodeURIComponent(album+" "+artist)+"&entity=album&limit=8");const d=await r.json();const x=(d.results||[]).find(v=>(v.collectionName||"").toLowerCase()===album.toLowerCase())||d.results?.[0];return x?.artworkUrl100?.replace("100x100","1000x1000")||""}catch(e){return""}}
async function resolveAlbum(a){try{const q=encodeURIComponent('album:"'+a.query+'" artist:"'+a.artistQuery+'"');const d=await api("/search?type=album&limit=5&q="+q);const x=(d.albums?.items||[]).find(v=>v.name.toLowerCase()===a.query.toLowerCase())||d.albums?.items?.[0];return x?{uri:x.uri,name:x.name,artist:x.artists?.[0]?.name}:null}catch(e){return null}}
async function playAlbum(a){if(!token){localStorage.setItem("pending_album",JSON.stringify(a));await login();return}try{const x=await resolveAlbum(a);if(!x){alert("No encontré este álbum en Spotify.");return}localStorage.setItem("pending_album",JSON.stringify(x));await api("/me/player/play",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({context_uri:x.uri,offset:{position:0},position_ms:0})});location.href="player.html"}catch(e){localStorage.setItem("pending_album",JSON.stringify(a));await login()}}
async function playRandom(){if(!token){localStorage.setItem("pending_random","1");await login();return}try{const queries=["pop","rock","latin","r&b","dance","chilean music","classic pop"];const q=queries[Math.floor(Math.random()*queries.length)];const d=await api("/search?type=track&limit=20&q="+encodeURIComponent(q));const items=d.tracks?.items||[];const t=items[Math.floor(Math.random()*items.length)];if(t){await api("/me/player/play",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({uris:[t.uri],position_ms:0})});location.href="player.html"}}catch(e){alert("Abre Spotify en un dispositivo activo e inténtalo de nuevo.")}}
async let albumPage=0;
const perPage=3;
const pageCount=Math.ceil(albums.length/perPage);
let artworkCache={};

function renderDots(){
  const dots=document.getElementById("dots");
  dots.innerHTML=Array.from({length:pageCount},(_,i)=>`<button class="dot ${i===albumPage?"active":""}" data-page="${i}" aria-label="Página ${i+1}"></button>`).join("");
  dots.querySelectorAll(".dot").forEach(d=>d.onclick=()=>showAlbumPage(+d.dataset.page));
}

async function showAlbumPage(page,animate=true){
  albumPage=(page+pageCount)%pageCount;
  const grid=document.getElementById("grid");
  if(animate){
    grid.style.opacity="0";
    grid.style.transform="translateY(8px)";
    await new Promise(r=>setTimeout(r,140));
  }
  const start=albumPage*perPage;
  const visible=albums.slice(start,start+perPage);
  grid.innerHTML=visible.map((a,n)=>{
    const i=start+n;
    const cached=artworkCache[i]||"";
    return `<article class="card"><div class="cover"><img id="img-${i}" alt="${esc(a.title)}" loading="eager" src="${cached}"></div><div class="info"><div class="title">${esc(a.title)}</div><div class="artist">${esc(a.artist)}</div><div class="year">${a.year} • ${esc(a.meta)}</div><div class="fact">${esc(a.fact)}</div><button class="listen" data-i="${i}">▶ Escuchar álbum</button></div></article>`;
  }).join("");
  document.querySelectorAll(".listen").forEach(b=>b.onclick=()=>playAlbum(albums[+b.dataset.i]));
  renderDots();
  if(animate){
    requestAnimationFrame(()=>{grid.style.opacity="1";grid.style.transform="translateY(0)"});
  }
  await Promise.all(visible.map(async(a,n)=>{
    const i=start+n;
    if(!artworkCache[i]){
      const url=await getArtwork(a.query,a.artistQuery);
      if(url){
        artworkCache[i]=url;
        const img=document.getElementById("img-"+i);
        if(img)img.src=url;
      }
    }
  }));
}

function nextAlbumPage(){showAlbumPage(albumPage+1)}
function prevAlbumPage(){showAlbumPage(albumPage-1)}
async function search(){const q=document.getElementById("q").value.trim();if(!q)return;const box=document.getElementById("results");box.innerHTML="<div style='color:#777'>Buscando…</div>";try{let d;if(token)d=await api("/search?type=album&limit=8&q="+encodeURIComponent(q));else{const r=await fetch("https://itunes.apple.com/search?term="+encodeURIComponent(q)+"&entity=album&limit=8");d=await r.json();d={albums:{items:(d.results||[]).map(x=>({name:x.collectionName,artists:[{name:x.artistName}],images:[{url:x.artworkUrl100?.replace("100x100","600x600")}]}))}}}const items=d.albums?.items||[];box.innerHTML=items.length?items.map((x,i)=>`<div class="result" data-i="${i}"><img src="${esc(x.images?.[0]?.url||"")}" alt=""><div><b>${esc(x.name)}</b><span>${esc(x.artists?.map(a=>a.name).join(", "))}</span></div></div>`).join(""):"<div style='color:#777'>No encontré resultados.</div>";document.querySelectorAll(".result").forEach((el,i)=>el.onclick=()=>{const x=items[i];playAlbum({query:x.name,artistQuery:x.artists?.[0]?.name||x.name})})}catch(e){box.innerHTML="<div style='color:#777'>No se pudo buscar.</div>"}}
document.getElementById("openPlayer").onclick=()=>location.href="player.html";
document.getElementById("random").onclick=playRandom;
document.getElementById("searchBtn").onclick=search;
document.getElementById("nextAlbums").onclick=nextAlbumPage;
document.getElementById("prevAlbums").onclick=prevAlbumPage;

let carouselTimer=setInterval(()=>nextAlbumPage(),5000);
document.querySelector(".album-carousel").addEventListener("mouseenter",()=>clearInterval(carouselTimer));
document.querySelector(".album-carousel").addEventListener("mouseleave",()=>carouselTimer=setInterval(()=>nextAlbumPage(),5000));
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")search()});

(async()=>{
 try{
   const hadCode=await exchange();
   const pending=localStorage.getItem("pending_album");
   const random=localStorage.getItem("pending_random");
   if(hadCode && pending){
     const a=JSON.parse(pending);localStorage.removeItem("pending_album");
     const x=await resolveAlbum(a);
     if(x)await api("/me/player/play",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({context_uri:x.uri,offset:{position:0},position_ms:0})});
     location.href="player.html";return;
   }
   if(hadCode && random){
     localStorage.removeItem("pending_random");await playRandom();return;
   }
 }catch(e){console.error(e)}
 render();
})();
</script>
</body>
</html>
